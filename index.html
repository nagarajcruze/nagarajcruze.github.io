<!DOCTYPE html>
<html lang="en">

<head>

    <!--- basic page needs
   ================================================== -->
    <meta charset="utf-8">
    <title>Nagaraj Cruze & Knowledge Base</title>
    <meta name="description"
        content="Nagaraj Cruze's personal portfolio and knowledge base. Explore DevOps, Videography, Photography, Audiophile gear, and Motorbikes.">
    <meta name="author" content="Nagaraj Cruze">
    <meta name="keywords" content="DevOps, Kubernetes, Docker, Terraform, CI/CD, Portfolio, Knowledge Base">

    <!-- mobile specific metas
   ================================================== -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- CSS
   ================================================== -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/knowledge-base.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Highlight.js — GitHub Dark theme for code blocks -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

    <!-- script
   ================================================== -->
    <script src="js/modernizr.js"></script>

    <!-- favicons
	================================================== -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preload" as="image" href="images/intro-bg.jpg">

    <!-- Umami Analytics -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="11e6ce83-6b33-41e5-98be-b617dc99566e" data-auto-track="false"></script>

</head>

<body id="top">

    <!-- intro section
   ================================================== -->
    <section id="intro">

        <div class="intro-overlay"></div>

        <div class="intro-content">
            <div class="row">

                <div class="col-twelve">
                    <h5>Hello, World.</h5>
                    <h1>I'm Nagaraj.</h1>

                    <p class="intro-position">
                        <span>Eat</span>
                        <span>Code</span>
                        <span>Ride</span>
                        <span>Sleep</span>
                    </p>
                    <h5>DevOps Engineer | Automation Enthusiast </h5>
                </div>

            </div>
        </div>
        <!-- /intro-content -->

        <ul class="intro-social">
            <li><a href="https://github.com/nagarajcruze" target="_blank" rel="noopener noreferrer"><i class="fa fa-github"></i></a></li>
            <li><a href="https://twitter.com/nagarajcruze" target="_blank" rel="noopener noreferrer"><i class="fa fa-twitter"></i></a></li>
            <li><a href="https://instagram.com/nagarajcruze" target="_blank" rel="noopener noreferrer"><i class="fa fa-instagram"></i></a></li>
            <li><a href="https://www.linkedin.com/in/nagaracruze/" target="_blank" rel="noopener noreferrer"><i class="fa fa-custom-linkedin"></i></a></li>
        </ul>
        <!-- /intro-social -->

        <!-- Bouncing scroll chevrons -->
        <a href="#knowledge-base" class="scroll-indicator smoothscroll">
            <div class="scroll-chevron">
                <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>
            <div class="scroll-chevron">
                <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </div>
        </a>

    </section>
    <!-- /intro -->


    <!-- knowledge base section
   ================================================== -->
    <section id="knowledge-base">

        <!-- Section Header -->
        <div class="kb-header kb-animate-in">
            <h2>Everything I've Learned</h2>
            <p>A living document of my expertise in DevOps, automation and passions</p>
        </div>

        <!-- Category Tabs (including inline Search Tab) -->
        <div class="kb-cat-tabs kb-animate-in">
            <div class="kb-search-tab">
                <span class="kb-search-icon" data-mode="search">
                    <svg class="kb-icon-search" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <svg class="kb-icon-close" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </span>
                <input type="text" id="kb-search-input" placeholder="Search...">
                <span class="kb-search-count"></span>
            </div>
            <!-- Categories rendered by JS -->
        </div>

        <!-- KB Layout Container -->
        <div class="kb-layout-container kb-animate-in">
            <!-- Left Navigation Sidebar -->
            <div class="kb-nav-sidebar">
                <!-- Topics list for active category -->
                <div class="kb-topics-list-container">
                    <!-- Topics list rendered by JS -->
                </div>
            </div>

            <!-- Content Panel (Inline on desktop, fixed slide-in drawer on mobile) -->
            <div class="kb-content-panel">
                <!-- Placeholder when no topic is selected -->
                <div class="kb-content-placeholder">
                    <div class="placeholder-icon">📖</div>
                    <div class="placeholder-title">Select a Topic</div>
                    <div class="placeholder-text">Choose a topic from the sidebar to start reading.</div>
                </div>
                <!-- Content View -->
                <div class="kb-content-inner kb-hidden">
                    <div class="kb-panel-topbar">
                        <div class="kb-panel-breadcrumb"></div>
                        <div class="kb-panel-actions">
                            <button class="kb-panel-btn" id="kb-panel-zen-btn" title="Fullscreen Reader" type="button">
                                <i class="fa fa-expand"></i>
                            </button>
                            <button class="kb-panel-btn kb-mobile-only" id="kb-panel-close-btn" title="Close"
                                type="button">✕</button>
                        </div>
                        <div class="kb-reading-progress" id="kb-progress-bar"></div>
                    </div>
                    <div class="kb-panel-body"></div>
                </div>
            </div>
        </div>

        <!-- Backdrop for mobile drawer mode -->
        <div class="kb-drawer-backdrop"></div>

    </section>
    <!-- /knowledge-base -->


    <div id="preloader">
        <div id="loader"></div>
    </div>

    <!-- Java Script
   ================================================== -->
    <script src="js/jquery-2.1.3.min.js"></script>
    <script src="js/plugins.js"></script>
    <script src="js/main.js"></script>

    <!-- Markdown & Syntax Highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/dockerfile.min.js"></script>

    <!-- Mermaid Diagrams -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>

    <!-- Knowledge Base Logic -->
    <script src="js/knowledge-base.js"></script>

</body>

</html>
